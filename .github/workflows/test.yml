name: test

on:
  push:
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run demo RAG question
        run: |
          set -o pipefail
          python txtai_rag_app.py --demo --ask "What was won?" | tee output.txt
      - name: Check answer mentions the lottery win
        run: grep -qi "lottery" output.txt
